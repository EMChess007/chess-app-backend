name: CI

# Runs on every push/PR targeting main — type-checks the backend and runs the full E2E +
# regression test suite against a real (ephemeral) Postgres + dev server, exactly like this
# project's own established "tsc --noEmit, then the full suite" habit, just automated.
#
# Several backend test scripts (scripts/test-fogOfWar*.mjs) import the mobile app's own
# src/logic/ChessEngine.ts directly (see those scripts' own doc comments for why — testing the
# real shared chess logic, not a reimplementation) via a relative path that assumes the local dev
# layout: chess-app/ (frontend) with chess-app/backend/ (this repo) nested inside it. Since this
# is a separate GitHub repo, that layout is recreated here by checking out EM-Chess first and this
# repo into chess-app/backend afterward, rather than at the default location.
# Which frontend branch? Only an EXPLICITLY paired one: a backend branch named `paired/<x>` is tested against
# EM-Chess's `paired/<x>` if that exists. Everything else (main, any branch without the `paired/` prefix, a
# `paired/<x>` with no twin) is tested against the frontend's default branch. A backend feature branch that
# depends on frontend code not merged yet (e.g. spell-chess: scripts/test-spell.mjs imports the new
# src/logic/spellChess.ts) is therefore tested against its own frontend branch instead of failing on a default
# branch that has never heard of the feature - but only when both branches opted in by name. Matching by
# plain name used to pair unrelated branches by coincidence (two tooling branches both called
# `workflow-yaml-precheck` made a backend run test against a frontend that predated the engine mirror).
# The step reports its choice as a notice annotation, so the run page and the API show which ref was used.
# Pushes to ANY branch run CI too (not just main): with branch protection requiring the `test`
# check on main, a commit can only reach main once that exact commit already has a passing check —
# so it has to be validated on a branch first.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://chess:chess@localhost:5432/chess_app
      JWT_SECRET: ci-test-secret-not-for-production
      PORT: 3000

    steps:
      - name: Pick the frontend ref — an EM-Chess branch only when this branch is paired/X and EM-Chess has paired/X, else its default branch
        id: frontend_ref
        env:
          # Passed through the environment, never interpolated into the script: a branch name is untrusted input.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=""
          case "$BRANCH" in
            paired/?*)
              if git ls-remote --exit-code --heads https://github.com/EMChess007/EM-Chess.git "refs/heads/$BRANCH" > /dev/null 2>&1; then
                ref="$BRANCH"
                msg="Paired: using EM-Chess branch '$BRANCH' (this branch opted in with the paired/ prefix and EM-Chess has the same name)."
              else
                msg="'$BRANCH' asks to be paired but EM-Chess has no branch '$BRANCH' - using EM-Chess's default branch."
              fi
              ;;
            *)
              msg="'$BRANCH' is not a paired/ branch - using EM-Chess's default branch (a same-named EM-Chess branch, if any, is ignored on purpose)."
              ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "$msg"
          echo "::notice title=Frontend ref::$msg"

      - name: Checkout frontend (EM-Chess) — several test scripts import its chess logic directly
        uses: actions/checkout@v4
        with:
          repository: EMChess007/EM-Chess
          ref: ${{ steps.frontend_ref.outputs.ref }}
          path: chess-app

      - name: Report which frontend commit was checked out
        run: echo "::notice title=Frontend checkout::EM-Chess $(git -C chess-app rev-parse --abbrev-ref HEAD) at $(git -C chess-app rev-parse --short HEAD)"

      - name: Checkout backend (this repo) into chess-app/backend — matches local dev layout
        uses: actions/checkout@v4
        with:
          path: chess-app/backend

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies (chess.js etc. — resolved by the cross-imported files)
        working-directory: chess-app
        run: npm ci

      - name: Install backend dependencies
        working-directory: chess-app/backend
        run: npm ci

      - name: Generate Prisma client and apply migrations
        working-directory: chess-app/backend
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Type-check (backend)
        working-directory: chess-app/backend
        run: npx tsc --noEmit

      # The server's 4 Player Chess engine and wire contract are GENERATED from the app's source (scripts/sync-fourplayer.mjs) and
      # committed. This fails the build if the committed copy is stale, hand-edited, missing a file or has a stray one - so it runs
      # right after the type-check, before anything slower. Like every cross-repo test here it checks against the frontend ref
      # chosen by the frontend-ref step above: name both repos' feature branches `paired/<x>` to test them together.
      - name: Check the 4 Player engine mirror is in sync with the app source
        working-directory: chess-app/backend
        run: npm run sync:fourplayer -- --check

      - name: Start dev server
        working-directory: chess-app/backend
        # FOUR_GRACE_MS shortens the 4 Player bot-takeover grace (45 s) so the real-socket 4 Player test below can watch a disconnect -> takeover ->
        # retake in seconds. The override is a test convenience: the server ignores it when NODE_ENV=production, and nothing else in this job
        # depends on the grace. (Set on the step, not the job: the server inherits it from this shell.)
        env:
          FOUR_GRACE_MS: '1500'
        run: nohup npm run dev > server.log 2>&1 &

      - name: Wait for server to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Server never became healthy — dumping log:"
          cat chess-app/backend/server.log || true
          exit 1

      - name: Run E2E test suite (multiplayer + tournaments)
        working-directory: chess-app/backend
        run: |
          node scripts/test-multiplayer.mjs
          node scripts/test-tournament.mjs

      - name: Run Fog of War regression suite
        working-directory: chess-app/backend
        run: |
          npm run test:fogOfWarEnPassant
          npm run test:fogOfWarPerformance
          npm run test:fogOfWarRedactionHistory
          npm run test:fogOfWarVisibilityGroundTruth
          npm run test:fogOfWarCastling
          npm run test:fogOfWarNotation

      - name: Run threefold repetition suite (every mode through the room manager, rejoin, parity with the mobile app)
        working-directory: chess-app/backend
        run: npm run test:repetition

      - name: Run Giveaway regression suite (server rules, authority, parity with the mobile app)
        working-directory: chess-app/backend
        run: npm run test:giveaway

      - name: Run Atomic regression suite (server rules authority, no-drift check, parity with the mobile app)
        working-directory: chess-app/backend
        run: npm run test:atomic

      - name: Run Duck Chess regression suite (server rules authority, no-drift check, parity with the mobile app)
        working-directory: chess-app/backend
        run: npm run test:duck

      - name: Run Spell Chess regression suite (Freeze/Jump authority, no-drift check, parity with the mobile app)
        working-directory: chess-app/backend
        run: npm run test:spell

      - name: Run Horde regression suite (server rules authority, no-drift check, parity with the mobile app)
        working-directory: chess-app/backend
        run: npm run test:horde

      - name: Run Crazyhouse regression suite (server rules authority, drops and reserves, no-drift check, parity with the mobile app)
        working-directory: chess-app/backend
        run: npm run test:crazyhouse

      - name: Run No time limit regression suite (unlimited clock, validation, pairing)
        working-directory: chess-app/backend
        run: npm run test:unlimited

      - name: Run rejoin-after-game-ended regression suite (finished-room retention)
        working-directory: chess-app/backend
        run: npm run test:rejoinFinished

      - name: Run 4 Player mirror generator tests (closure rule, drift detection, CRLF tolerance)
        working-directory: chess-app/backend
        run: npm run test:fourplayerSync

      - name: Run 4 Player engine parity (app engine vs the generated server copy, seeded full games in lockstep)
        working-directory: chess-app/backend
        run: npm run test:fourplayer

      - name: Run 4 Player room manager tests (commit funnel, clocks, rejoin, chat, spectating, hostile input, replay parity)
        working-directory: chess-app/backend
        run: npm run test:fourplayerRooms

      - name: Run 4 Player bot / takeover / abandonment tests (bot driver, ELO clamp, retake, all-gone, fast-forward, replay parity)
        working-directory: chess-app/backend
        run: npm run test:fourplayerBots

      - name: Run 4 Player matchmaking tests (lobby rules, fill timer, shuffle, failed start)
        working-directory: chess-app/backend
        run: npm run test:fourplayerMatchmaking

      - name: Run 4 Player socket handler tests (nine events, join guards, JWT identity, a whole game in-process, hostile input)
        working-directory: chess-app/backend
        run: npm run test:fourplayerHandlers

      - name: "Run 4 Player Giveaway server tests (variant plumbing: rooms, lobbies that never mix, handlers, the Giveaway bot over a whole game in-process)"
        working-directory: chess-app/backend
        run: npm run test:fourplayerGiveaway

      - name: "Run Chaturaji server tests (the Chaturaji bot over whole games, takeover and hand-back, every ending with points, the dead-king walk, a queue that never mixes with the other variants)"
        working-directory: chess-app/backend
        run: npm run test:fourplayerChaturaji

      # The first test that holds FOUR real connections to one room (everything above runs the 4 Player server logic in-process on stub sockets): it
      # reuses the dev server started earlier - which is why that step sets FOUR_GRACE_MS - and proves all four players and a spectator hold the
      # byte-identical snapshot at every seq, plus the disconnect/takeover/retake, resign, chat, spectate and listing flows.
      # (W4 of 4 Player Giveaway: the same script now also holds the Giveaway scenarios - the variant over real sockets, a quiet move refused while a capture
      # is mandatory, a whole natural game with a consistent result, resignations, a takeover bot facing a forced capture, the listing next to a Chess room,
      # and lobbies that never mix variants.)
      # (Chaturaji W2: scenarios 17-21 hold the Chaturaji room over real sockets - a whole natural game with a spectator, resignations that leave a walking dead king,
      # a takeover bot on the 8 x 8 board and the human's retake, and two players whose queue is filled by bots after the fill timer. The last one waits out the
      # server's default 30 s fill wait, so the step takes about half a minute longer than before.)
      - name: Run 4 Player Online e2e test (real server, socket.io-client; Chess, Giveaway and Chaturaji)
        working-directory: chess-app/backend
        run: npm run test:fourplayerOnline

      # The app now remembers the online game it is in, so a reload / app kill can rejoin the seat: a REAL new process rejoins with only the saved record
      # (2 players: Classic + Crazyhouse / Duck / Spell / Fog of War state; 4 Player, 4 Player Giveaway and Chaturaji). Needs the same FOUR_GRACE_MS dev server.
      - name: Run the rejoin-after-restart e2e test (real server, a new process as the restarted app)
        working-directory: chess-app/backend
        run: npm run test:rejoinPersist

      # The e2e scripts that register real accounts delete them again (success or failure); this unit test pins that cleanup. test-tournament.mjs above already
      # fails when an account it registered survives its own cleanup.
      - name: Run the test-account cleanup unit test (no server needed)
        working-directory: chess-app/backend
        run: npm run test:userCleanup

      - name: Dump server log on failure
        if: failure()
        run: cat chess-app/backend/server.log || true
