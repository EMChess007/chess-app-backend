name: Nightly extended fuzz

# Runs thousands of randomized Fog of War games — far more than ci.yml's per-commit counts can
# afford without slowing down every push — on a schedule instead, so a rare bug (like the en
# passant / performance / visibility issues found during this project's own investigation) has a
# real chance of surfacing even when it needs thousands of games to show up even once.
#
# Visibility if something fails: this workflow uploads its two markdown reports as build artifacts
# on every run (pass or fail), and opens/updates a single pinned GitHub issue when the run fails
# (closing it automatically next time the run passes) — see the last two steps. GitHub also emails
# the workflow file's last editor by default whenever a scheduled run fails, with no extra setup.
on:
  schedule:
    # 03:00 UTC every night — low-traffic hours, well clear of ci.yml's own on-push runs.
    - cron: '0 3 * * *'
  workflow_dispatch: {} # lets a maintainer trigger it manually from the Actions tab too.

permissions:
  contents: read
  actions: read

jobs:
  fuzz:
    runs-on: ubuntu-latest

    # The failure-tracking steps below open/update/close an issue; without issues: write they died with
    # "Resource not accessible by integration" and no tracking issue was ever created.
    permissions:
      contents: read
      issues: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://chess:chess@localhost:5432/chess_app
      JWT_SECRET: ci-test-secret-not-for-production
      PORT: 3000

    steps:
      # (command #35b: the same rule as ci.yml - a paired/X branch of this repo runs against the EM-Chess branch of the same name, so a manual run on paired/bughouse tests the unmerged app)
      - name: Pick the frontend ref — an EM-Chess branch only when this branch is paired/X and EM-Chess has paired/X, else its default branch
        id: frontend_ref
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          ref=""
          case "$BRANCH" in
            paired/?*)
              if git ls-remote --exit-code --heads https://github.com/EMChess007/EM-Chess.git "refs/heads/$BRANCH" > /dev/null 2>&1; then ref="$BRANCH"; fi
              ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "::notice title=Frontend ref::EM-Chess ref '${ref:-default branch}' for '$BRANCH'"

      - name: Checkout frontend (EM-Chess) — the logic fuzz imports its chess engine directly
        uses: actions/checkout@v4
        with:
          repository: EMChess007/EM-Chess
          ref: ${{ steps.frontend_ref.outputs.ref }}
          path: chess-app

      - name: Checkout backend (this repo) into chess-app/backend — matches local dev layout
        uses: actions/checkout@v4
        with:
          path: chess-app/backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: chess-app
        run: npm ci

      - name: Install backend dependencies
        working-directory: chess-app/backend
        run: npm ci

      - name: Generate Prisma client and apply migrations
        working-directory: chess-app/backend
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Pure-logic fuzz (3000 games, both ChessEngine implementations)
        id: logic_fuzz
        working-directory: chess-app/backend
        # tsx, not plain node: the script imports the frontend's chess engine as .ts, which Node 20
        # cannot load (ERR_UNKNOWN_FILE_EXTENSION) — that crashed every nightly run before it could
        # write a report. Same runner the package.json test scripts use.
        run: npx tsx scripts/nightly-fuzz-logic.mjs 3000 80
        continue-on-error: true

      - name: Start dev server (for the online fuzz below)
        working-directory: chess-app/backend
        # FOUR_GRACE_MS shortens the 4 Player bot-takeover grace (45 s) so the 4 Player part of the online fuzz can watch takeovers; it is ignored
        # when NODE_ENV=production and affects nothing else.
        env:
          FOUR_GRACE_MS: '1500'
        run: nohup npm run dev > server.log 2>&1 &

      - name: Wait for server to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat chess-app/backend/server.log || true
          exit 1

      - name: Online fuzz (Fog of War, Giveaway, Atomic, Duck Chess, 4 Player Chess, 4 Player Giveaway, Chaturaji and Bughouse through the live server/socket protocol)
        id: online_fuzz
        working-directory: chess-app/backend
        # Arguments: fogGames maxPlies giveawayGames atomicGames duckGames fourPlayerGames fourPlayerGiveawayGames. The first five are what an omitted argument used to
        # default to (200 each); 4 Player Chess and 4 Player Giveaway are 40 each because each game has FOUR sockets and is paced under the server's move rate limit (about 5-6 s a
        # game, so about 4 minutes per variant). tsx for the same reason as the logic fuzz above.
        # Chaturaji is the LAST argument (40 games, like the other two 4-seat variants): hordeGames and crazyhouseGames are passed at the 200 an omitted argument gives them, and repetition at its default 3.
        # Bughouse is the very LAST argument (40 matches, four sockets and a spectator each, strict: any deviation fails the run).
        run: npx tsx scripts/nightly-fuzz-online.mjs 200 80 200 200 200 40 40 200 200 3 40 40
        continue-on-error: true

      # Bughouse W7: the scripted real-socket scenarios (a resignation from each seat, capture and drop across the boards, a flag on each board with a late mate, a takeover and hand-back on each seat with a
      # NEW process as the restarted app, a late spectator, every other 4-seat queue at the same time, a whole natural game). About 3 minutes; the same dev server (without FOUR_FILL_MS the lobby
      # scenario simply waits for the production 30 s fill, inside the test's own bound).
      - name: Bughouse real-socket scenarios (W7)
        id: bughouse_sockets
        working-directory: chess-app/backend
        run: npm run test:bughouseSockets
        continue-on-error: true

      - name: Browser end-to-end (Chaturaji - the REAL app in Chrome against a private copy of this server)
        id: browser_e2e
        working-directory: chess-app/backend
        # Chaturaji W4 (backend/scripts/e2e-browser). It starts its OWN backend on port 3191 (the dev server above keeps 3000) and its own static copy of the frontend's web build,
        # exported from the frontend checked out above with EXPO_PUBLIC_API_URL pointing at that backend, and drives them with Playwright over the Chrome that ubuntu-latest ships
        # (no browser download). Nightly, not per push: it exports the web app (~1 minute), then plays eight scenarios with real clocks (a one-minute game to a flag, bot games to their end),
        # which is several times the per-push budget. Test accounts it registers are deleted again; the database is this job's own Postgres service.
        run: npm run test:e2eBrowser
        continue-on-error: true

      # Bughouse browser end-to-end (W4 + W8, command #34): the REAL app in Chrome against a private copy of this server. W4 is one game of two humans; W8 is the rest of the flow (FOUR humans on four
      # pages with every position compared on all of them, orientation, quick messages and team chat that only the partner gets, a reload, a bot takeover and the hand-back, a spectator page,
      # the friend flow on two pages). Seeded (the suite seeds its own server process; nothing is set here), about 6 minutes; each scenario may repeat once.
      - name: Browser end-to-end (Bughouse W4 + W8)
        id: bughouse_browser
        working-directory: chess-app/backend
        run: |
          npm run test:e2eBrowserBughouse
          npm run test:e2eBrowserBughouseW8
        continue-on-error: true

      - name: Upload fuzz reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-reports
          path: |
            chess-app/backend/nightly-fuzz-report.md
            chess-app/backend/nightly-fuzz-online-report.md
          retention-days: 90

      - name: Fail the job if either fuzz run or the browser end-to-end failed
        if: steps.logic_fuzz.outcome == 'failure' || steps.online_fuzz.outcome == 'failure' || steps.bughouse_sockets.outcome == 'failure' || steps.browser_e2e.outcome == 'failure' || steps.bughouse_browser.outcome == 'failure'
        run: exit 1

      - name: Open/update a tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return '(report file not found — job may have crashed before writing it)'; } };
            const logicReport = read('chess-app/backend/nightly-fuzz-report.md');
            const onlineReport = read('chess-app/backend/nightly-fuzz-online-report.md');
            const title = 'Nightly fuzz failure';
            const body = `The nightly extended Fog of War fuzz found something. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n<details><summary>Pure-logic fuzz report</summary>\n\n${logicReport}\n\n</details>\n\n<details><summary>Online fuzz report</summary>\n\n${onlineReport}\n\n</details>\n`;
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: ['nightly-fuzz'] });
            if (existing.data.length > 0) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['nightly-fuzz'] });
            }

      - name: Close the tracking issue once the run passes again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: ['nightly-fuzz'] });
            for (const issue of existing.data) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: 'Nightly fuzz passed again — closing.' });
            }
