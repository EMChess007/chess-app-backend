name: security-audit

# THE PERMANENT DEPENDENCY GUARD (command #31, CHECKLIST.md section 8; the app repo's CHECKLIST.md section 19 has the full rule). The check is called `security-audit` and it is RED on ANY known
# vulnerability in the lockfile - every severity (low included), production AND development dependencies (no --omit, no --audit-level, no continue-on-error, no allow-list): the project's rule
# is zero, never "accepted risk". `npm audit` asks the registry's advisory database, which grows without any commit of ours, so besides every push / pull request it runs WEEKLY on a schedule:
# a new advisory against a package we already ship turns the check red on Monday morning even when nobody pushed (GitHub emails the last editor of this file when a scheduled run fails).
# Install first (`npm ci`, not only the lock): a lock that does not install cleanly is found by the same job. This job needs neither a database nor the app checkout.
# Fixing a red run, in this order: upgrade the direct dependency; an `overrides` pin of the transitive package, after the suites pass; remove or replace the dependency; a reviewed patch.
# Never `npm audit fix --force`. scripts/test-security-audit.mjs (`npm run test:securityAudit`) pins this file, so the guard cannot be weakened quietly.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    # Mondays 05:23 UTC, well clear of the nightly fuzz run (03:00) and of the top of the hour.
    - cron: '23 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Audit every dependency (production and development, every severity)
        run: npm audit
