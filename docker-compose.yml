services:
  postgres:
    image: postgres:16-alpine
    container_name: chess-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess_app
    ports:
      - "5432:5432"
    volumes:
      - chess-app-postgres-data:/var/lib/postgresql/data

volumes:
  chess-app-postgres-data:
